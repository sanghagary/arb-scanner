name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install pkg
        run: npm install -g pkg

      - name: Create dist folder
        run: mkdir -p dist

      - name: Build Windows EXE
        run: pkg server.js --target node18-win-x64 --output dist/arb-scanner.exe --compress GZip

      - name: Copy scanner.html alongside exe
        run: copy scanner.html dist\scanner.html

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: arb-scanner-windows
          path: |
            dist/arb-scanner.exe
            dist/scanner.html
          retention-days: 30
